<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ══════════════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════════════════════════════════════
const API_BASE = 'https://ai-based-resume-screening-system-tlbb.onrender.com/api';

// ══════════════════════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ══════════════════════════════════════════════════════════════════════════════
function getScoreColor(score) {
  if (score >= 75) return { text: 'text-green-600', bg: 'bg-green-100', border: 'border-green-300', hex: '#16a34a' };
  if (score >= 50) return { text: 'text-yellow-600', bg: 'bg-yellow-100', border: 'border-yellow-300', hex: '#d97706' };
  return { text: 'text-red-600', bg: 'bg-red-100', border: 'border-red-300', hex: '#dc2626' };
}

function getScoreLabel(score) {
  if (score >= 85) return 'Excellent Match';
  if (score >= 70) return 'Good Match';
  if (score >= 55) return 'Fair Match';
  if (score >= 40) return 'Partial Match';
  return 'Low Match';
}

// ══════════════════════════════════════════════════════════════════════════════
// COMPONENTS
// ══════════════════════════════════════════════════════════════════════════════

// ── GitHub Sign-In Modal ─────────────────────────────────────────────────────
function GitHubSignInModal({ open, onClose, onSignIn }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!open) return;
    const handleKey = (event) => { if (event.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [open, onClose]);

  if (!open) return null;

  const submit = (event) => {
    event.preventDefault();
    setError('');
    if (!username.trim() || !password) {
      setError('Please enter both your username and password.');
      return;
    }
    setLoading(true);
    window.setTimeout(() => {
      setLoading(false);
      onSignIn(username.trim());
      setUsername('');
      setPassword('');
      onClose();
    }, 700);
  };

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4" role="dialog" aria-modal="true" aria-labelledby="github-signin-title">
      <div className="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative w-full max-w-sm rounded-xl border border-slate-700 bg-[#0d1117] p-6 shadow-2xl text-[#f0f6fc]">
        <button onClick={onClose} className="absolute right-4 top-4 text-slate-400 hover:text-white text-xl leading-none" aria-label="Close">×</button>
        <div className="text-center mb-6">
          <svg className="mx-auto mb-4" viewBox="0 0 16 16" width="48" height="48" fill="#f0f6fc" aria-label="GitHub">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 018 4.58c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          <h2 id="github-signin-title" className="text-xl font-light text-[#f0f6fc]">Sign in to GitHub</h2>
        </div>

        <form onSubmit={submit} className="rounded-md border border-[#30363d] bg-[#161b22] p-4">
          {error && <div className="mb-3 rounded-md border border-red-700/60 bg-red-950/50 px-3 py-2 text-xs text-red-300">{error}</div>}
          <label htmlFor="github-username" className="block text-sm font-medium mb-1.5">Username or email address</label>
          <input
            id="github-username"
            type="text"
            autoComplete="username"
            value={username}
            onChange={(event) => setUsername(event.target.value)}
            className="mb-4 w-full rounded-md border border-[#30363d] bg-[#0d1117] px-3 py-2 text-sm text-white outline-none focus:border-[#58a6ff] focus:ring-2 focus:ring-[#58a6ff]/25"
            autoFocus
          />
          <div className="flex items-center justify-between mb-1.5">
            <label htmlFor="github-password" className="text-sm font-medium">Password</label>
            <button type="button" className="text-xs text-[#58a6ff] hover:underline">Forgot password?</button>
          </div>
          <input
            id="github-password"
            type="password"
            autoComplete="current-password"
            value={password}
            onChange={(event) => setPassword(event.target.value)}
            className="mb-4 w-full rounded-md border border-[#30363d] bg-[#0d1117] px-3 py-2 text-sm text-white outline-none focus:border-[#58a6ff] focus:ring-2 focus:ring-[#58a6ff]/25"
          />
          <button type="submit" disabled={loading} className="w-full rounded-md border border-[#3fb950] bg-[#238636] px-4 py-2 text-sm font-semibold text-white hover:bg-[#2ea043] disabled:cursor-wait disabled:opacity-70">
            {loading ? 'Signing in…' : 'Sign in'}
          </button>
        </form>

        <div className="mt-4 rounded-md border border-[#30363d] px-4 py-3 text-center text-sm">
          New to GitHub? <button type="button" className="text-[#58a6ff] hover:underline">Create an account</button>
        </div>
        <div className="mt-5 flex justify-center gap-4 text-xs text-[#8b949e]">
          <button className="hover:text-[#58a6ff]">Terms</button>
          <button className="hover:text-[#58a6ff]">Privacy</button>
          <button className="hover:text-[#58a6ff]">Security</button>
          <button className="hover:text-[#58a6ff]">Contact GitHub</button>
        </div>
      </div>
    </div>
  );
}

// ── Navigation Bar ────────────────────────────────────────────────────────────

            <div className="w-6 h-0.5 bg-white mb-1.5"></div>
            <div className="w-6 h-0.5 bg-white"></div>
          </button>
        </div>

        {/* Mobile Menu */}
        {menuOpen && (
          <div className="md:hidden py-3 border-t border-navy-700">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setActiveTab(item.id); setMenuOpen(false); }}
                className={`block w-full text-left px-4 py-3 text-sm font-medium rounded-lg mb-1
                  ${activeTab === item.id ? 'bg-blue-600 text-white' : 'text-gray-300 hover:bg-navy-700'}`}
              >
                {item.label}
              </button>
            ))}
            {user ? (
              <button onClick={() => { onSignOut(); setMenuOpen(false); }} className="mt-2 block w-full text-left px-4 py-3 text-sm font-medium rounded-lg text-white border border-slate-600">
                Sign out ({user})
              </button>
            ) : (
              <button onClick={() => { onSignIn(); setMenuOpen(false); }} className="mt-2 block w-full text-left px-4 py-3 text-sm font-medium rounded-lg text-white border border-slate-600">
                Sign in with GitHub
              </button>
            )}
          </div>
        )}
      </div>
    </nav>
  );
}

// ── Score Ring Component (SVG circular progress) ──────────────────────────────
function ScoreRing({ score, size = 120 }) {
  const radius = (size - 20) / 2;
  const circumference = 2 * Math.PI * radius;
  const [animatedScore, setAnimatedScore] = useState(0);
  const colors = getScoreColor(score);

  useEffect(() => {
    const timer = setTimeout(() => setAnimatedScore(score), 100);
    return () => clearTimeout(timer);
  }, [score]);

  const strokeDasharray = `${(animatedScore / 100) * circumference} ${circumference}`;

  return (
    <div className="relative inline-flex items-center justify-center">
      <svg width={size} height={size} className="-rotate-90">
        {/* Background track */}
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="#e5e7eb" strokeWidth="10" />
        {/* Score arc */}
        <circle
          cx={size/2} cy={size/2} r={radius}
          fill="none"
          stroke={colors.hex}
          strokeWidth="10"
          strokeLinecap="round"
          strokeDasharray={strokeDasharray}
          className="score-ring"
        />
      </svg>
      <div className="absolute text-center">
        <div className={`text-2xl font-bold ${colors.text}`}>{score}%</div>
        <div className="text-xs text-gray-500 font-medium">Match</div>
      </div>
    </div>
  );
}

// ── Progress Bar ──────────────────────────────────────────────────────────────
function ProgressBar({ value, label, color = 'bg-blue-500', showValue = true }) {
  const [width, setWidth] = useState(0);
  useEffect(() => { const t = setTimeout(() => setWidth(value), 200); return () => clearTimeout(t); }, [value]);
  return (
    <div className="mb-3">
      <div className="flex justify-between items-center mb-1">
        <span className="text-sm text-gray-600 font-medium">{label}</span>
        {showValue && <span className="text-sm font-bold text-gray-800">{Math.round(value)}%</span>}
      </div>
      <div className="h-2.5 bg-gray-200 rounded-full overflow-hidden">
        <div
          className={`h-full ${color} rounded-full progress-fill`}
          style={{ width: `${width}%` }}
        />
      </div>
    </div>
  );
}

// ── Skill Badge ───────────────────────────────────────────────────────────────
function SkillBadge({ skill, variant = 'default' }) {
  const styles = {
    matched: 'bg-green-100 text-green-700 border border-green-300',
    missing: 'bg-red-100 text-red-700 border border-red-300',
    default: 'bg-blue-100 text-blue-700 border border-blue-300',
    gray: 'bg-gray-100 text-gray-700 border border-gray-200',
  };
  return (
    <span className={`skill-badge inline-block px-2.5 py-1 rounded-full text-xs font-medium mr-2 mb-2 ${styles[variant]}`}>
      {variant === 'matched' && '✓ '}{variant === 'missing' && '✗ '}{skill}
    </span>
  );
}

                <div className="relative inline-flex items-center justify-center w-20 h-20 bg-navy-800 rounded-2xl mb-5 mx-auto">
                  <span className="text-3xl">{item.icon}</span>
                  <span className="absolute -top-2 -right-2 w-7 h-7 bg-blue-500 rounded-full text-white text-xs font-bold flex items-center justify-center">
                    {item.step}
                  </span>
                </div>
                <h3 className="text-lg font-bold text-navy-800 mb-2">{item.title}</h3>
                <p className="text-gray-500 text-sm">{item.desc}</p>
              </div>
            ))}
          </div>

          <div className="text-center mt-12">
            <button
              onClick={() => setActiveTab('screen')}
              className="bg-navy-800 hover:bg-navy-900 text-white font-semibold px-8 py-3 rounded-xl transition-all duration-200 hover:-translate-y-1"
            >
              Try It Now →
            </button>
          </div>
        </div>
      </section>

      {/* ── Disclaimer ── */}
      <section className="py-10 px-4 bg-amber-50 border-t border-amber-200">
        <div className="max-w-4xl mx-auto text-center">
          <div className="inline-flex items-start gap-3 text-left bg-white rounded-xl p-5 shadow-sm border border-amber-200 max-w-2xl">
            <span className="text-2xl flex-shrink-0">⚠️</span>
            <div>
              <p className="font-semibold text-amber-700 mb-1">Important Disclaimer</p>
              <p className="text-sm text-gray-600">
                This AI system provides automated screening assistance only. All match scores are based on
                text analysis and should not be the sole basis for hiring decisions. Final decisions must be
                made by qualified human recruiters. This tool does not evaluate candidates based on
                protected personal attributes.
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

// UPLOAD & SCREENING PAGE
// ══════════════════════════════════════════════════════════════════════════════
function ScreeningPage({ setResults, setActiveTab, setSessionData }) {
  const [files, setFiles] = useState([]);
  const [jobDescription, setJobDescription] = useState('');
  const [jobTitle, setJobTitle] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [dragging, setDragging] = useState(false);
  const [charCount, setCharCount] = useState(0);
  const [sampleJDs, setSampleJDs] = useState([]);
  const [showSamples, setShowSamples] = useState(false);
  const fileInputRef = useRef(null);

  // Load sample job descriptions from API
  useEffect(() => {
    fetch(`${API_BASE}/sample-data`)
      .then(r => r.json())
      .then(data => { if (data.job_descriptions) setSampleJDs(data.job_descriptions); })
      .catch(() => {});
  }, []);

  const handleFileChange = (e) => {
    const newFiles = Array.from(e.target.files);
    addFiles(newFiles);
  };

  const addFiles = (newFiles) => {
    const valid = newFiles.filter(f => {
      const ext = f.name.split('.').pop().toLowerCase();
      return ['pdf', 'docx', 'doc'].includes(ext);
    });
    if (valid.length !== newFiles.length) {
      setError(`Only PDF and DOCX files are supported. ${newFiles.length - valid.length} file(s) were rejected.`);
    }
    setFiles(prev => {
      const existing = new Set(prev.map(f => f.name));
      const unique = valid.filter(f => !existing.has(f.name));
      return [...prev, ...unique];
    });
  };

  const removeFile = (index) => {
    setFiles(prev => prev.filter((_, i) => i !== index));
  };

  const handleDragOver = (e) => { e.preventDefault(); setDragging(true); };
  const handleDragLeave = () => setDragging(false);
  const handleDrop = (e) => {
    e.preventDefault();
    setDragging(false);
    addFiles(Array.from(e.dataTransfer.files));
  };

  const loadSampleJD = (jd) => {
    setJobTitle(jd.title);
    setJobDescription(jd.description);
    setCharCount(jd.description.length);
    setShowSamples(false);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    if (files.length === 0) { setError('Please upload at least one resume file.'); return; }
    if (!jobDescription.trim() || jobDescription.trim().length < 50) {
      setError('Please provide a detailed job description (at least 50 characters).'); return;
    }

    setLoading(true);
    const formData = new FormData();
    files.forEach(f => formData.append('files', f));
    formData.append('job_description', jobDescription);
    formData.append('job_title', jobTitle || 'Software Engineer');

    try {
      const response = await fetch(`${API_BASE}/analyze`, {
        method: 'POST',
        body: formData,
      });
      const data = await response.json();

      if (!response.ok) {
        setError(data.error || 'Analysis failed. Please try again.');
        return;
      }

      setResults(data);
      setSessionData({ jobTitle: data.job_title, jobSkills: data.job_skills });
      setActiveTab('results');
    } catch (err) {
      setError('Could not connect to the backend server. Make sure Flask is running on port 5000.');
    } finally {
      setLoading(false);
    }
  };

  const getFileIcon = (filename) => {
    const ext = filename.split('.').pop().toLowerCase();
    return ext === 'pdf' ? '📄' : '📝';
  };

  const formatFileSize = (bytes) => {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  };

  return (
    <div className="min-h-screen bg-gray-50 pt-20 pb-12 animate-fade-in">
      <div className="max-w-4xl mx-auto px-4">
        {/* Header */}
        <div className="text-center mb-10">
          <h1 className="text-3xl md:text-4xl font-bold text-navy-900 mb-3">Screen Resumes</h1>
          <p className="text-gray-500 text-lg">Upload resumes and provide a job description to start AI analysis</p>
        </div>

        <form onSubmit={handleSubmit} className="space-y-6">
          {/* Error Alert */}
          {error && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 flex items-start gap-3 animate-slide-up">
              <span className="text-red-500 text-xl flex-shrink-0">⚠️</span>
              <div>
                <p className="text-red-700 font-medium">{error}</p>
              </div>
              <button onClick={() => setError('')} className="ml-auto text-red-400 hover:text-red-600">✕</button>
            </div>
          )}

          {/* Resume Upload Section */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 className="text-xl font-semibold text-navy-800 mb-4 flex items-center gap-2">
              <span className="w-7 h-7 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-sm font-bold">1</span>
              Upload Resume Files
            </h2>

            {/* Drop Zone */}
            <div
              className={`drop-zone rounded-xl p-8 text-center cursor-pointer ${dragging ? 'dragging' : ''}`}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop}
              onClick={() => fileInputRef.current?.click()}
            >
              <div className="text-5xl mb-3">📂</div>
              <p className="text-gray-700 font-medium mb-1">Drag & drop resume files here</p>
              <p className="text-gray-400 text-sm mb-4">or click to browse files</p>
              <div className="flex items-center justify-center gap-3">
                <span className="bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-full font-medium">PDF</span>
                <span className="bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-full font-medium">DOCX</span>
                <span className="text-gray-400 text-xs">Max 16MB per file</span>
              </div>
              <input
                ref={fileInputRef}
                type="file"
                multiple
                accept=".pdf,.docx,.doc"
                onChange={handleFileChange}
                className="hidden"
              />
            </div>

            {/* File List */}
            {files.length > 0 && (
              <div className="mt-4 space-y-2">
                <p className="text-sm font-medium text-gray-600">{files.length} file(s) selected:</p>
                {files.map((file, i) => (
                  <div key={i} className="flex items-center gap-3 bg-gray-50 rounded-lg px-4 py-3 border border-gray-100">
                    <span className="text-2xl">{getFileIcon(file.name)}</span>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-gray-800 truncate">{file.name}</p>
                      <p className="text-xs text-gray-400">{formatFileSize(file.size)}</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => removeFile(i)}
                      className="text-gray-400 hover:text-red-500 transition-colors p-1 rounded"
                    >
                      ✕
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Job Description Section */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-xl font-semibold text-navy-800 flex items-center gap-2">
                <span className="w-7 h-7 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-sm font-bold">2</span>
                Job Description
              </h2>
              {sampleJDs.length > 0 && (
                <div className="relative">
                  <button
                    type="button"
                    onClick={() => setShowSamples(!showSamples)}
                    className="text-sm text-blue-600 hover:text-blue-700 font-medium border border-blue-200 rounded-lg px-3 py-1.5 hover:bg-blue-50 transition-colors"
                  >
                    📋 Load Sample JD
                  </button>
                  {showSamples && (
                    <div className="absolute right-0 mt-1 w-56 bg-white rounded-xl shadow-lg border border-gray-100 z-10 overflow-hidden">
                      {sampleJDs.map((jd, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => loadSampleJD(jd)}
                          className="block w-full text-left px-4 py-3 text-sm hover:bg-gray-50 border-b last:border-0 border-gray-100"
                        >
                          <span className="font-medium text-gray-800">{jd.title}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Job Title Input */}
            <div className="mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-1.5">Job Title</label>
              <input
                type="text"
                value={jobTitle}
                onChange={e => setJobTitle(e.target.value)}
                placeholder="e.g. Full Stack Developer, Data Scientist"
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            {/* Job Description Textarea */}
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1.5">
                Job Description & Requirements <span className="text-red-400">*</span>
              </label>
              <textarea
                value={jobDescription}
                onChange={e => { setJobDescription(e.target.value); setCharCount(e.target.value.length); }}
                placeholder="Paste the full job description here, including required skills, experience, education, and responsibilities...&#10;&#10;Example:&#10;We are looking for a Python Developer with 2+ years of experience in:&#10;- Python, Django, Flask&#10;- SQL, PostgreSQL&#10;- REST API development&#10;- Git, Docker&#10;Bachelor's degree in Computer Science required."
                rows={10}
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y font-mono text-sm"
                required
              />
              <p className="text-xs text-gray-400 mt-1 text-right">
                {charCount} characters {charCount < 50 && <span className="text-red-400">(minimum 50 required)</span>}
              </p>
            </div>
          </div>

          {/* Submit Button */}
          <button
            type="submit"
            disabled={loading || files.length === 0}
            className={`w-full py-4 rounded-xl font-semibold text-lg transition-all duration-200 flex items-center justify-center gap-3
              ${loading || files.length === 0
                ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                : 'bg-navy-800 hover:bg-navy-900 text-white hover:shadow-lg hover:-translate-y-0.5'}`}
          >
            {loading ? (
              <>
                <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full spinner"></div>
                <span>Analyzing Resumes with AI...</span>
              </>
            ) : (
              <>
                <span>🤖</span>
                <span>Analyze {files.length > 0 ? `${files.length} Resume${files.length > 1 ? 's' : ''}` : 'Resumes'} with AI</span>
              </>
            )}
          </button>
        </form>
      </div>
    </div>
  );
}

// RESULTS DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
function ResultsDashboard({ results, sessionData }) {
  const [selectedCandidate, setSelectedCandidate] = useState(null);
  const [view, setView] = useState('table'); // 'table' | 'cards'

  if (!results) return null;

  const { results: candidates, job_title, job_skills, total_candidates, session_id, errors } = results;

  const getRankStyle = (rank) => {
    if (rank === 1) return 'rank-gold text-white';
    if (rank === 2) return 'rank-silver text-white';
    if (rank === 3) return 'rank-bronze text-white';
    return 'bg-gray-100 text-gray-700';
  };

  const downloadReport = async (candidateId, name) => {
    try {
      const response = await fetch(`${API_BASE}/report/${candidateId}`);
      if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report_${name.replace(/\s+/g, '_')}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        a.remove();
      } else {
        alert('Report generation failed. Make sure reportlab is installed.');
      }
    } catch (err) {
      alert('Could not download report: ' + err.message);
    }
  };

  return (
    <div className="min-h-screen bg-gray-50 pt-20 pb-12 animate-fade-in">
      <div className="max-w-7xl mx-auto px-4">
        {/* Header */}
        <div className="mb-8">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h1 className="text-2xl md:text-3xl font-bold text-navy-900">Analysis Results</h1>
              <p className="text-gray-500 mt-1">
                {total_candidates} candidate{total_candidates !== 1 ? 's' : ''} screened for
                <span className="font-semibold text-navy-700"> {job_title}</span>
              </p>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs text-gray-400 bg-gray-100 px-3 py-1.5 rounded-full font-mono">
                Session: {session_id}
              </span>
              {/* View Toggle */}
              <div className="flex items-center bg-gray-100 rounded-lg p-1">
                <button
                  onClick={() => setView('table')}
                  className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${view === 'table' ? 'bg-white shadow-sm text-navy-800' : 'text-gray-500'}`}
                >
                  ≡ Table
                </button>
                <button
                  onClick={() => setView('cards')}
                  className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${view === 'cards' ? 'bg-white shadow-sm text-navy-800' : 'text-gray-500'}`}
                >
                  ⊞ Cards
                </button>
              </div>
            </div>
          </div>

          {/* Error notices */}
          {errors && errors.length > 0 && (
            <div className="mt-4 bg-yellow-50 border border-yellow-200 rounded-xl p-4">
              <p className="text-sm font-medium text-yellow-700 mb-1">⚠️ Some files had issues:</p>
              {errors.map((e, i) => <p key={i} className="text-sm text-yellow-600">• {e}</p>)}
            </div>
          )}
        </div>

        {/* Summary Stats */}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          {[
            { label: 'Top Score', value: `${candidates[0]?.match_score || 0}%`, icon: '🏆', color: 'text-green-600' },
            { label: 'Average Score', value: `${Math.round(candidates.reduce((a,c) => a + c.match_score, 0) / candidates.length)}%`, icon: '📊', color: 'text-blue-600' },
            { label: 'High Matches (≥75%)', value: candidates.filter(c => c.match_score >= 75).length, icon: '✅', color: 'text-green-600' },
            { label: 'Job Skills Identified', value: (job_skills || []).length, icon: '🎯', color: 'text-purple-600' },
          ].map((s, i) => (
            <div key={i} className="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
              <div className="text-2xl mb-2">{s.icon}</div>
              <div className={`text-2xl font-bold ${s.color}`}>{s.value}</div>
              <div className="text-xs text-gray-500 mt-0.5">{s.label}</div>
            </div>
          ))}
        </div>

        {/* Job Skills Identified */}
        {job_skills && job_skills.length > 0 && (
          <div className="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm mb-6">
            <h3 className="text-sm font-semibold text-gray-700 mb-3">📌 Skills Identified in Job Description ({job_skills.length})</h3>
            <div className="flex flex-wrap">
              {job_skills.map((s, i) => <SkillBadge key={i} skill={s} variant="gray" />)}
            </div>
          </div>
        )}

        {/* ── TABLE VIEW ── */}
        {view === 'table' && (
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-6">
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead>
                  <tr className="border-b border-gray-100 bg-gray-50">
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider">Rank</th>
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider">Candidate</th>
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider">Score</th>
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider hidden md:table-cell">Matched Skills</th>
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider hidden lg:table-cell">Experience</th>
                    <th className="text-left text-xs font-semibold text-gray-500 px-5 py-3 uppercase tracking-wider">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {candidates.map((c, i) => {
                    const colors = getScoreColor(c.match_score);
                    return (
                      <tr key={i} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                        <td className="px-5 py-4">
                          <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold ${getRankStyle(c.rank)}`}>
                            {c.rank}
                          </span>
                        </td>
                        <td className="px-5 py-4">
                          <div className="font-medium text-gray-900">{c.candidate_name}</div>
                          <div className="text-xs text-gray-400 truncate max-w-xs">{c.filename}</div>
                        </td>
                        <td className="px-5 py-4">
                          <div className="flex items-center gap-3">
                            <span className={`text-lg font-bold ${colors.text}`}>{c.match_score}%</span>
                            <div className="hidden sm:block w-24">
                              <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                <div
                                  className={`h-full rounded-full ${c.match_score >= 75 ? 'bg-green-500' : c.match_score >= 50 ? 'bg-yellow-500' : 'bg-red-500'}`}
                                  style={{ width: `${c.match_score}%` }}
                                />
                              </div>
                            </div>
                          </div>
                          <div className="text-xs text-gray-400 mt-0.5">{getScoreLabel(c.match_score)}</div>
                        </td>
                        <td className="px-5 py-4 hidden md:table-cell">
                          <span className="text-sm text-gray-700">{c.matched_skills.length} of {(job_skills || []).length} skills</span>
                          <div className="flex flex-wrap mt-1 max-w-xs">
                            {c.matched_skills.slice(0, 3).map((s, j) => (
                              <span key={j} className="text-xs bg-green-100 text-green-700 rounded px-1.5 py-0.5 mr-1 mb-1">{s}</span>
                            ))}
                            {c.matched_skills.length > 3 && (
                              <span className="text-xs text-gray-400">+{c.matched_skills.length - 3} more</span>
                            )}
                          </div>
                        </td>
                        <td className="px-5 py-4 hidden lg:table-cell text-sm text-gray-600">
                          {c.experience_years > 0 ? `${c.experience_years} yrs` : '—'}
                        </td>
                        <td className="px-5 py-4">
                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => setSelectedCandidate(c)}
                              className="text-xs bg-navy-800 text-white px-3 py-1.5 rounded-lg hover:bg-navy-900 transition-colors"
                            >
                              View
                            </button>
                            <button
                              onClick={() => downloadReport(c.id, c.candidate_name)}
                              className="text-xs bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-200 transition-colors"
                              title="Download PDF Report"
                            >
                              📥
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ── CARDS VIEW ── */}
        {view === 'cards' && (
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 mb-6">
            {candidates.map((c, i) => {
              const colors = getScoreColor(c.match_score);
              return (
                <div key={i} className="card-hover bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                  {/* Score banner */}
                  <div className={`h-1.5 ${c.match_score >= 75 ? 'bg-green-500' : c.match_score >= 50 ? 'bg-yellow-500' : 'bg-red-500'}`} />
                  <div className="p-5">
                    <div className="flex items-start justify-between mb-4">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className={`text-xs font-bold px-2 py-0.5 rounded-full text-white ${c.rank <= 3 ? (c.rank === 1 ? 'bg-yellow-500' : c.rank === 2 ? 'bg-gray-400' : 'bg-orange-500') : 'bg-gray-300 text-gray-700'}`}>
                            #{c.rank}
                          </span>
                          <span className={`text-xs font-medium ${colors.text} ${colors.bg} px-2 py-0.5 rounded-full`}>
                            {getScoreLabel(c.match_score)}
                          </span>
                        </div>
                        <h3 className="font-bold text-gray-900">{c.candidate_name}</h3>
                        <p className="text-xs text-gray-400 truncate">{c.filename}</p>
                      </div>
                      <ScoreRing score={c.match_score} size={80} />
                    </div>

                    {/* Score breakdown bars */}
                    <div className="mb-4">
                      {c.score_breakdown && Object.entries({
                        'TF-IDF Similarity': c.score_breakdown.tfidf,
                        'Skill Match': c.score_breakdown.skill_match,
                        'Education': c.score_breakdown.education,
                        'Experience': c.score_breakdown.experience,
                      }).map(([label, val]) => (
                        <ProgressBar
                          key={label}
                          label={label}
                          value={val || 0}
                          color={val >= 70 ? 'bg-green-500' : val >= 45 ? 'bg-yellow-500' : 'bg-red-400'}
                        />
                      ))}
                    </div>

                    {/* Skills preview */}
                    <div className="mb-4">
                      <p className="text-xs font-semibold text-gray-500 mb-2">MATCHED SKILLS</p>
                      <div className="flex flex-wrap">
                        {c.matched_skills.slice(0, 4).map((s, j) => <SkillBadge key={j} skill={s} variant="matched" />)}
                        {c.matched_skills.length > 4 && (
                          <span className="text-xs text-gray-400 self-center">+{c.matched_skills.length - 4}</span>
                        )}
                        {c.matched_skills.length === 0 && <span className="text-xs text-gray-400">None identified</span>}
                      </div>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => setSelectedCandidate(c)}
                        className="flex-1 bg-navy-800 text-white py-2 rounded-lg text-sm font-medium hover:bg-navy-900 transition-colors"
                      >
                        Full Analysis
                      </button>
                      <button
                        onClick={() => downloadReport(c.id, c.candidate_name)}
                        className="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm hover:bg-gray-200 transition-colors"
                        title="Download Report"
                      >
                        📥
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── Disclaimer ── */}
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-700">
          ⚠️ <strong>Reminder:</strong> These AI-generated scores are decision-support tools only.
          Hiring decisions must be made by qualified human recruiters through comprehensive evaluation.
        </div>
      </div>

      {/* ── Candidate Detail Modal ── */}
      {selectedCandidate && (
        <CandidateDetailModal
          candidate={selectedCandidate}
          jobSkills={job_skills || []}
          onClose={() => setSelectedCandidate(null)}
          onDownload={downloadReport}
        />
      )}
    </div>
  );
}

// CANDIDATE DETAIL MODAL
// ══════════════════════════════════════════════════════════════════════════════
function CandidateDetailModal({ candidate, jobSkills, onClose, onDownload }) {
  const [activeTab, setActiveTab] = useState('overview');
  const colors = getScoreColor(candidate.match_score);

  const tabs = [
    { id: 'overview', label: 'Overview' },
    { id: 'skills', label: 'Skills Analysis' },
    { id: 'insights', label: 'Insights' },
  ];

  return (
    <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-start justify-center p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full my-8 animate-slide-up">
        {/* Modal Header */}
        <div className="bg-navy-800 rounded-t-2xl p-6 text-white">
          <div className="flex items-start justify-between">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <span className="bg-blue-500 text-white text-sm font-bold px-3 py-1 rounded-full">
                  Rank #{candidate.rank}
                </span>
                <span className={`text-sm font-medium px-3 py-1 rounded-full ${colors.bg} ${colors.text}`}>
                  {getScoreLabel(candidate.match_score)}
                </span>
              </div>
              <h2 className="text-2xl font-bold">{candidate.candidate_name}</h2>
              <p className="text-blue-200 text-sm mt-1">{candidate.filename}</p>
            </div>
            <div className="flex items-center gap-3">
              <ScoreRing score={candidate.match_score} size={80} />
              <button
                onClick={onClose}
                className="text-blue-200 hover:text-white p-2 rounded-lg hover:bg-navy-700 transition-colors"
              >
                ✕
              </button>
            </div>
          </div>

          {/* Quick Stats */}
          <div className="grid grid-cols-3 gap-3 mt-5">
            <div className="bg-navy-700 rounded-lg p-3 text-center">
              <div className="text-xl font-bold text-green-400">{candidate.matched_skills.length}</div>
              <div className="text-xs text-blue-200">Matched Skills</div>
            </div>
            <div className="bg-navy-700 rounded-lg p-3 text-center">
              <div className="text-xl font-bold text-red-400">{(candidate.missing_skills || []).length}</div>
              <div className="text-xs text-blue-200">Missing Skills</div>
            </div>
            <div className="bg-navy-700 rounded-lg p-3 text-center">
              <div className="text-xl font-bold text-blue-300">
                {candidate.experience_years > 0 ? `${candidate.experience_years}y` : '—'}
              </div>
              <div className="text-xs text-blue-200">Experience</div>
            </div>
          </div>
        </div>

        {/* Tab Navigation */}
        <div className="flex border-b border-gray-100">
          {tabs.map(tab => (
            <button
              key={tab.id}
              onClick={() => setActiveTab(tab.id)}
              className={`flex-1 py-3.5 text-sm font-medium transition-all ${activeTab === tab.id ? 'tab-active' : 'text-gray-500 hover:text-gray-700'}`}
            >
              {tab.label}
            </button>
          ))}
        </div>

        {/* Tab Content */}
        <div className="p-6 max-h-96 overflow-y-auto">
          {/* Overview Tab */}
          {activeTab === 'overview' && (
            <div>
              <h3 className="font-semibold text-gray-700 mb-4">Score Breakdown</h3>
              {candidate.score_breakdown && Object.entries({
                'TF-IDF Cosine Similarity (40% weight)': candidate.score_breakdown.tfidf,
                'Skill Match Rate (40% weight)': candidate.score_breakdown.skill_match,
                'Education Level Match (10% weight)': candidate.score_breakdown.education,
                'Experience Match (10% weight)': candidate.score_breakdown.experience,
              }).map(([label, val]) => (
                <ProgressBar
                  key={label}
                  label={label}
                  value={val || 0}
                  color={val >= 70 ? 'bg-green-500' : val >= 45 ? 'bg-yellow-500' : 'bg-red-400'}
                />
              ))}

              {candidate.education && candidate.education.length > 0 && (
                <div className="mt-5">
                  <h3 className="font-semibold text-gray-700 mb-3">🎓 Education</h3>
                  {candidate.education.map((edu, i) => (
                    <div key={i} className="flex items-start gap-2 mb-2">
                      <span className="text-blue-500 mt-0.5">•</span>
                      <p className="text-sm text-gray-600">{edu}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Skills Tab */}
          {activeTab === 'skills' && (
            <div>
              <div className="mb-6">
                <h3 className="font-semibold text-gray-700 mb-3">
                  ✅ Matched Skills <span className="text-green-600 font-bold">({candidate.matched_skills.length})</span>
                </h3>
                <div className="flex flex-wrap">
                  {candidate.matched_skills.length > 0
                    ? candidate.matched_skills.map((s, i) => <SkillBadge key={i} skill={s} variant="matched" />)
                    : <p className="text-gray-400 text-sm">No matching skills identified</p>
                  }
                </div>
              </div>

              <div>
                <h3 className="font-semibold text-gray-700 mb-3">
                  ❌ Missing Skills <span className="text-red-600 font-bold">({(candidate.missing_skills || []).length})</span>
                </h3>
                <div className="flex flex-wrap">
                  {(candidate.missing_skills || []).length > 0
                    ? (candidate.missing_skills || []).map((s, i) => <SkillBadge key={i} skill={s} variant="missing" />)
                    : <p className="text-gray-400 text-sm">No significant skill gaps identified</p>
                  }
                </div>
              </div>

              <div className="mt-6 bg-gray-50 rounded-xl p-4">
                <div className="text-sm text-gray-600">
                  Skill Match Rate:
                  <span className={`ml-2 font-bold ${colors.text}`}>
                    {jobSkills.length > 0
                      ? `${candidate.matched_skills.length} / ${jobSkills.length} (${Math.round((candidate.matched_skills.length / jobSkills.length) * 100)}%)`
                      : `${candidate.matched_skills.length} skills found`
                    }
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* Insights Tab */}
          {activeTab === 'insights' && (
            <div className="space-y-5">
              <div>
                <h3 className="font-semibold text-green-700 mb-3 flex items-center gap-2">
                  <span>💪</span> Strengths
                </h3>
                <ul className="space-y-2">
                  {(candidate.strengths || []).map((s, i) => (
                    <li key={i} className="flex items-start gap-2 bg-green-50 rounded-lg p-3">
                      <span className="text-green-500 mt-0.5 flex-shrink-0">✓</span>
                      <span className="text-sm text-gray-700">{s}</span>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <h3 className="font-semibold text-orange-700 mb-3 flex items-center gap-2">
                  <span>⚠️</span> Areas for Improvement
                </h3>
                <ul className="space-y-2">
                  {(candidate.weaknesses || []).map((w, i) => (
                    <li key={i} className="flex items-start gap-2 bg-orange-50 rounded-lg p-3">
                      <span className="text-orange-500 mt-0.5 flex-shrink-0">!</span>
                      <span className="text-sm text-gray-700">{w}</span>
                    </li>
                  ))}
                </ul>
              </div>

              <div>
                <h3 className="font-semibold text-blue-700 mb-3 flex items-center gap-2">
                  <span>💡</span> Recommendations
                </h3>
                <ul className="space-y-2">
                  {(candidate.suggestions || []).map((s, i) => (
                    <li key={i} className="flex items-start gap-2 bg-blue-50 rounded-lg p-3">
                      <span className="text-blue-500 mt-0.5 flex-shrink-0 font-bold">{i+1}.</span>
                      <span className="text-sm text-gray-700">{s}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>

        {/* Modal Footer */}
        <div className="border-t border-gray-100 p-5 flex gap-3">
          <button
            onClick={() => onDownload(candidate.id, candidate.candidate_name)}
            className="flex-1 bg-navy-800 text-white py-2.5 rounded-xl font-medium hover:bg-navy-900 transition-colors flex items-center justify-center gap-2"
          >
            📥 Download PDF Report
          </button>
          <button
            onClick={onClose}
            className="px-6 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition-colors font-medium"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

// HISTORY PAGE
// ══════════════════════════════════════════════════════════════════════════════
function HistoryPage() {
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch(`${API_BASE}/sessions`)
      .then(r => r.json())
      .then(data => { setSessions(data.sessions || []); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  return (
    <div className="min-h-screen bg-gray-50 pt-20 pb-12 animate-fade-in">
      <div className="max-w-4xl mx-auto px-4">
        <div className="mb-8">
          <h1 className="text-3xl font-bold text-navy-900 mb-2">Screening History</h1>
          <p className="text-gray-500">Past resume screening sessions</p>
        </div>

        {loading ? (
          <div className="text-center py-16">
            <div className="w-10 h-10 border-4 border-navy-800 border-t-transparent rounded-full spinner mx-auto mb-4"></div>
            <p className="text-gray-500">Loading sessions...</p>
          </div>
        ) : sessions.length === 0 ? (
          <div className="text-center py-20 bg-white rounded-2xl border border-gray-100">
            <div className="text-6xl mb-4">📂</div>
            <h3 className="text-xl font-semibold text-gray-700 mb-2">No Sessions Yet</h3>
            <p className="text-gray-400">Start by screening some resumes to see your history here.</p>
          </div>
        ) : (
          <div className="space-y-3">
            {sessions.map((s, i) => (
              <div key={i} className="bg-white rounded-xl border border-gray-100 p-5 flex items-center justify-between shadow-sm">
                <div>
                  <p className="font-semibold text-gray-900">{s.job_title || 'Untitled Job'}</p>
                  <p className="text-sm text-gray-400 mt-0.5">
                    {new Date(s.created_at).toLocaleString()} · {s.candidate_count} candidate(s) · Session: {s.session_id}
                  </p>
                </div>
                {s.top_score && (
                  <div className={`text-lg font-bold ${getScoreColor(s.top_score).text}`}>
                    Top: {s.top_score}%
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════════════════════
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [results, setResults] = useState(null);
  const [sessionData, setSessionData] = useState({});
  const [apiStatus, setApiStatus] = useState('checking'); // 'ok' | 'error' | 'checking'
  const [signInOpen, setSignInOpen] = useState(false);
  const [githubUser, setGithubUser] = useState(() => localStorage.getItem('githubUser') || '');

  // Check if backend API is reachable
  useEffect(() => {
    fetch(`${API_BASE}/health`)
      .then(r => r.json())
      .then(data => {
        if (data.status === 'ok') setApiStatus('ok');
        else setApiStatus('error');
      })
      .catch(() => setApiStatus('error'));
  }, []);

  // Auto-navigate to results when available
  const handleSetResults = (data) => {
    setResults(data);
    setActiveTab('results');
  };

  const handleGitHubSignIn = (username) => {
    setGithubUser(username);
    localStorage.setItem('githubUser', username);
  };

  const handleGitHubSignOut = () => {
    setGithubUser('');
    localStorage.removeItem('githubUser');
  };

  return (
    <div className="min-h-screen">
      <Navbar
        activeTab={activeTab}
        setActiveTab={setActiveTab}
        onSignIn={() => setSignInOpen(true)}
        user={githubUser}
        onSignOut={handleGitHubSignOut}
      />
      <GitHubSignInModal
        open={signInOpen}
        onClose={() => setSignInOpen(false)}
        onSignIn={handleGitHubSignIn}
      />

      {/* API Status Banner */}
      {apiStatus === 'error' && (
        <div className="fixed top-16 w-full z-40 bg-red-600 text-white text-center py-2.5 px-4 text-sm">
          ⚠️ Backend server is not responding. Please run: <code className="bg-red-700 px-2 py-0.5 rounded mx-1">python backend/app.py</code>
          and refresh the page.
        </div>
      )}
      {apiStatus === 'ok' && (
        <div className="fixed top-16 w-full z-40 bg-green-600 text-white text-center py-1.5 px-4 text-xs opacity-90" style={{animationDelay: '3s'}}>
          ✅ Backend connected successfully · AI analysis ready
        </div>
      )}

      {/* Page Content */}
      <div className={apiStatus !== 'checking' ? 'pt-6' : ''}>
        {activeTab === 'home' && <HomePage setActiveTab={setActiveTab} />}
        {activeTab === 'screen' && (
          <ScreeningPage
            setResults={handleSetResults}
            setActiveTab={setActiveTab}
            setSessionData={setSessionData}
          />
        )}
        {activeTab === 'results' && results && (
          <ResultsDashboard results={results} sessionData={sessionData} />
        )}
        {activeTab === 'results' && !results && (
          <div className="min-h-screen flex items-center justify-center pt-20">
            <div className="text-center">
              <div className="text-6xl mb-4">📊</div>
              <h2 className="text-2xl font-bold text-gray-700 mb-2">No Results Yet</h2>
              <p className="text-gray-500 mb-6">Screen some resumes first to see the results dashboard.</p>
              <button
                onClick={() => setActiveTab('screen')}
                className="bg-navy-800 text-white px-6 py-3 rounded-xl font-medium hover:bg-navy-900 transition-colors"
              >
                Go to Screen Resumes →
              </button>
            </div>
          </div>
        )}
        {activeTab === 'history' && <HistoryPage />}
        {activeTab === 'about' && <AboutPage />}
      </div>

      {/* Footer */}
      <footer className="bg-navy-900 text-gray-400 py-8 px-4 mt-10">
        <div className="max-w-6xl mx-auto text-center">
          <div className="flex items-center justify-center gap-2 mb-3">
            <div className="w-7 h-7 bg-blue-500 rounded-lg flex items-center justify-center">
              <span className="text-white font-bold text-sm">AI</span>
            </div>
            <span className="text-white font-semibold">AI Resume Screening System</span>
          </div>
          <p className="text-sm mb-2">2nd Year CSE AI Project · Built with React.js, Python Flask, NLTK & scikit-learn</p>
          <p className="text-xs text-gray-600">
            For educational purposes only. Not intended for use in actual hiring processes without human review.
          </p>
        </div>
      </footer>
    </div>
  );
}

// Mount React app to DOM
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
